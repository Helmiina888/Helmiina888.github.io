<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Helmina — musiikille tilaa kasvaa.">
  <title>Helmina — musiikille tilaa kasvaa</title>
  <style>
    :root { color-scheme:dark; --night:#101827; --night2:#18253a; --paper:#f5efe4; --muted:#c0c3ca; --copper:#d5a17c; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 18px; overflow:hidden; background:radial-gradient(ellipse at 50% 0%,#293852 0%,transparent 52%),linear-gradient(145deg,var(--night),#0b111d 75%); color:var(--paper); font-family:Georgia,'Times New Roman',serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.16; background-image:radial-gradient(circle at 1px 1px,rgba(245,239,228,.35) 1px,transparent 0); background-size:34px 34px; mask-image:linear-gradient(to bottom,black,transparent 75%); }
    main { position:relative; width:min(100%,800px); padding:clamp(46px,10vw,94px) clamp(24px,8vw,80px); text-align:center; border:1px solid rgba(213,161,124,.35); background:linear-gradient(145deg,rgba(24,37,58,.9),rgba(13,21,34,.88)); box-shadow:0 30px 100px rgba(0,0,0,.28); }
    .mark { width:58px; height:58px; margin:0 auto 28px; border:1px solid var(--copper); border-radius:50%; display:grid; place-items:center; color:var(--copper); font-size:1.3rem; }
    .eyebrow { margin:0 0 18px; color:var(--copper); font:600 .72rem/1.5 'Segoe UI',sans-serif; letter-spacing:.28em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(3.8rem,13vw,7.6rem); line-height:.98; font-weight:400; letter-spacing:.035em; }
    .subtitle { margin:24px 0 0; color:var(--copper); font-size:clamp(1.15rem,3.5vw,1.65rem); font-style:italic; }
    .wave { display:flex; align-items:center; justify-content:center; gap:5px; height:46px; margin:34px auto; }
    .wave span { display:block; width:2px; border-radius:2px; background:var(--copper); opacity:.86; }
    .wave span:nth-child(6n+1) { height:12px; } .wave span:nth-child(6n+2) { height:23px; } .wave span:nth-child(6n+3) { height:34px; } .wave span:nth-child(6n+4) { height:18px; } .wave span:nth-child(6n+5) { height:40px; } .wave span:nth-child(6n) { height:27px; }
    .intro { max-width:440px; margin:0 auto; color:var(--muted); font:400 1rem/1.9 'Segoe UI',sans-serif; }
    .note { margin:34px 0 0; color:rgba(245,239,228,.55); font:500 .68rem/1.6 'Segoe UI',sans-serif; letter-spacing:.19em; text-transform:uppercase; }
    footer { margin-top:52px; color:rgba(245,239,228,.42); font: .72rem/1.5 'Segoe UI',sans-serif; letter-spacing:.12em; }
    @media(max-width:480px) { main { padding-top:54px; padding-bottom:54px; } .note { letter-spacing:.12em; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♫</div>
    <p class="eyebrow">Musiikillinen nimi</p>
    <h1>Helmina</h1>
    <p class="subtitle">Musiikille tilaa kasvaa.</p>
    <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><div></div><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <p class="intro">Tämä on Helminan oma paikka verkossa. Ajatus saa vielä muotoutua rauhassa — täällä on tilaa musiikille, tunnelmille ja sille, mitä tästä aikanaan syntyy.</p>
    <p class="note">Sivu rakentuu hiljalleen</p>
    <footer>HELMINA · OMA ÄÄNI, OMA SUUNTA</footer>
  </main>
</body>
</html>
